syntax = "proto3";

package protocol;

option go_package = "im/core/protocol/pb;pb";

message IMMessage {
  string type = 1;      // 消息类型: text, emoji, image, file, etc.
  string from = 2;      // 发送方UID
  string from_username = 3;
  string to = 4;        // 接收方UID
  string content = 5;   // 文本内容、表情代码、图片URL、文件URL等
  int64  timestamp = 6; // 消息时间戳
  string extra = 7;     // 扩展字段（如图片缩略图、文件名、文件大小等）
  string token = 8;     // 登录鉴权token
  bytes  data = 9;      // 二进制数据（图片、文件等）
  string filename = 10;  // 文件名
  int64  filesize = 11; // 文件大小（字节）
  string mime_type = 12; // MIME类型
  string group_id = 13; // 新增：群组ID
}

// 通用通知消息（兼容好友、群组、系统等所有场景）
message Notification {
  string type = 1;      // 通知类型，如 friend_request, group_kicked, group_dismissed, group_message
  string from = 2;      // 触发方UID
  string from_username = 3; // 触发方用户名
  string to = 4;        // 接收方UID（可选，群通知可为空）
  string group_id = 5;  // 群ID（可选）
  string group_name = 6;// 群名（可选）
  string content = 7;   // 通知内容（如验证消息、群聊消息文本等）
  int64  timestamp = 8; // 通知时间
  string extra = 9;     // 扩展字段（结构化key:value,逗号分隔，便于未来扩展）
}

// 文件信息
message FileInfo {
  string filename = 1;      // 服务器文件名
  string original_name = 2; // 原始文件名
  int64  size = 3;          // 文件大小
  string type = 4;          // 文件类型
  string url = 5;           // 文件URL
}

message IMMessageList {
  repeated IMMessage messages = 1;
}

// 获取最近私聊消息
message GetRecentPrivateMessagesReq {
  string from = 1;
  string to = 2;
  int64 count = 3;
}

// 获取最近群聊消息
message GetRecentGroupMessagesReq {
  string group_id = 1;
  int64 count = 2;
} 
